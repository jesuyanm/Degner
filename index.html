<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Degner Construction</title>
    <link rel="icon" href="favicon.png?v=2" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="favicon.png?v=2">
    <meta name="description" content="Our new website is on the way. Degner Construction will be back online shortly.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Degner Construction Incorporated">
    <style>
        :root {
            --white: #FFFFFF;
            --background-dark: #0F1419;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--white);
            background: var(--background-dark);
            overflow: hidden;
        }

        /* Full-bleed moody background */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(15,20,25,0.35), rgba(15,20,25,0.92) 85%),
                linear-gradient(rgba(15,20,25,0.55), rgba(15,20,25,0.55)),
                url('pic4.png') center / cover no-repeat;
            filter: grayscale(1) contrast(1.1);
            animation: drift 30s ease-in-out infinite alternate;
        }

        @keyframes drift {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .page {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 3rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 96px;
            flex-shrink: 0;
        }

        .logo img {
            height: 44px;
            display: block;
            filter: invert(1);
            mix-blend-mode: screen;
        }

        /* Center */
        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeUp 1s ease-out both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .line {
            width: 1px;
            height: clamp(40px, 9vh, 90px);
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.8));
        }

        .line.bottom { background: linear-gradient(to top, transparent, rgba(255,255,255,0.8)); }

        .eyebrow {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            opacity: 0.75;
            padding-left: 0.5em;
        }

        h1 {
            margin: 0.9rem 0 2.25rem;
            font-size: clamp(2.2rem, 8vw, 6.5rem);
            font-weight: 300;
            line-height: 1.05;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding-left: 0.3em;
        }

        h1 strong { font-weight: 700; }

        .need-now { font-size: 0.85rem; opacity: 0.75; line-height: 1.8; }
        .need-now a { color: var(--white); text-underline-offset: 3px; }
        .need-now a:hover { opacity: 0.7; }

        .need-now a.btn {
            display: inline-block;
            margin-left: 0.4rem;
            padding: 0.2rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: var(--transition);
        }

        .need-now a.btn:hover { opacity: 1; background: var(--white); color: #0a0a0a; }

        .line.bottom { margin-top: 0.75rem; }

        /* Bottom bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            flex-shrink: 0;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .bottom-bar span, .bottom-bar p { opacity: 0.65; }

        .social { display: flex; gap: 0.6rem; }

        .social a {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            color: var(--white);
            transition: var(--transition);
        }

        .social a:hover { background: var(--white); color: #0a0a0a; transform: translateY(-3px); }
        .social svg { width: 16px; height: 16px; }

        @media (max-width: 700px) {
            html, body { height: auto; }
            body { overflow-x: hidden; overflow-y: auto; }
            .page { height: auto; min-height: 100vh; min-height: 100dvh; padding: 0 1.25rem; }
            .header { height: auto; flex-direction: column; gap: 1.1rem; padding: 2.5rem 0 0.75rem; }
            .bg { inset: -10vh 0; }
            .logo img { height: 34px; }
            .center { padding: 2rem 0; }
            .line { height: 40px; }
            .eyebrow { margin-top: 1.25rem; font-size: 0.72rem; letter-spacing: 0.3em; padding-left: 0.3em; }
            h1 { margin: 0.75rem 0 1.75rem; font-size: clamp(2.2rem, 11vw, 3.2rem); letter-spacing: 0.18em; padding-left: 0.18em; }
            h1 strong { display: block; }
            .need-now { line-height: 2.2; }
            .bottom-bar { flex-direction: column; gap: 0.75rem; text-align: center; padding: 2rem 0 1.5rem; }
            .social { order: -1; }
        }

        @media (max-height: 600px) {
            .line { display: none; }
            h1 { margin-bottom: 1.25rem; }
        }
    </style>
</head>
<body>
